<!DOCTYPE html>
<html lang="en">

<head>
  <title>YojanaSathi</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>YojanaSathi</h1>
        <p id="tagline"></p>
      </div>
    </div>
  </header>

  <main>
    <form class="profile" id="form" novalidate>
      <h2 id="form-title"></h2>
      <div id="fields"></div>
      <button class="go" type="submit" id="go"></button>
      <button class="alt" type="button" id="quick"></button>
      <p class="fine" id="fine"></p>
    </form>

    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <script>
    // ---------- text ----------
    const TEXT = {
      tagline: "Finds the government schemes you may qualify for, searching official sites live and showing proof from the page.",
      formTitle: "Your details",
      go: "Find all schemes for me", working: "Searching...", quick: "Check saved schemes only (fast)",
      fine: "Guidance only. Always confirm on the official website before applying.",
      emptyTitle: "Your results will appear here",
      emptyBody: "Fill in your details and press Find all schemes. The app searches official government sites, reads each scheme's rules, and shows results as they arrive. The first search can take a few minutes.",
      errTitle: "Something went wrong", errHint: "Check that the server is running, then try again.",
      demo: "These are demo schemes, not real ones. Use Find all schemes to load real ones.",
      noSchemes: "No schemes are saved yet. Use Find all schemes to search live.",
      noneFound: "No official scheme pages were found for these details. Try changing the state or occupation.",
      searching: "Searching official government sites...",
      progress: (d, n) => `Checked ${d} of ${n} schemes`,
      foundN: (n, c) => `${n} official pages found${c ? `, ${c} already saved` : ""}.`,
      skipped: (n) => `${n} pages could not be read or had no scheme details.`,
      finished: "Search complete.",
      results: "Results", tally: (e, m, n) => `${e} likely eligible, ${m} to check, ${n} not eligible`,
      status: { eligible: "✓ Likely eligible", maybe: "? Check details", not_eligible: "✗ Not eligible" },
      benefits: "Benefit", deadline: "Deadline", why: "Why", verify: "Also confirm yourself",
      docs: "Documents to gather", docsDone: (a, b) => `${a} of ${b} ready`,
      evYes: "Matches the official page word for word", evNo: "Could not be matched word for word on the fetched page. Check the source.",
      open: "Open the official page",
      fields: {
        age: "Age", income: "Family income per year", incomeHint: "in rupees", state: "State / UT",
        category: "Category", gender: "Gender", education: "Education level", occupation: "Occupation",
        marks: "Last exam marks", marksHint: "percent", choose: "Select",
        limit: "Schemes to check", limitHint: "more takes longer",
      },
    };

    const OPTIONS = {
      category: ["General", "OBC", "SC", "ST", "EWS"],
      gender: ["Male", "Female", "Other"],
      education: ["Class 10", "Class 12", "Diploma", "Undergraduate", "Postgraduate"],
      occupation: ["Student", "Farmer", "Unemployed / job seeker", "Self-employed / entrepreneur", "Salaried / worker", "Artisan / craftsperson", "Homemaker", "Senior citizen"],
      limit: ["6", "10", "20"],
    };
    const STATES = ["Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal", "Andaman and Nicobar Islands", "Chandigarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Jammu and Kashmir", "Ladakh", "Lakshadweep", "Puducherry"];
    const ORDER = { eligible: 0, maybe: 1, not_eligible: 2 };

    const t = () => TEXT;

    // ---------- tiny DOM helper (builds elements safely, no innerHTML) ----------
    function el(tag, props = {}, ...kids) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") n.className = v;
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? "" : v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return n;
    }

    // ---------- form ----------
    const saved = { limit: "10" }; // keeps typed values when switching language
    function readForm() {
      const out = {};
      document.querySelectorAll("#fields [name]").forEach((i) => (out[i.name] = i.value));
      return out;
    }
    function readProfile() {
      const { limit, ...profile } = readForm();
      return { profile, limit: Number(limit) || 10 };
    }

    function buildForm() {
      Object.assign(saved, readForm());
      const f = t().fields;
      const input = (name, label, hint, attrs) =>
        el("div", { class: "field" },
          el("label", { for: name }, label, hint && el("span", { class: "hint" }, ` (${hint})`)),
          el("input", { id: name, name, type: "number", inputmode: "numeric", value: saved[name] ?? "", ...attrs }));
      const select = (name, label, options, hint, required) =>
        el("div", { class: "field" },
          el("label", { for: name }, label, hint && el("span", { class: "hint" }, ` (${hint})`)),
          el("select", { id: name, name },
            !required && el("option", { value: "" }, f.choose),
            options.map(([value, text]) => el("option", { value, selected: saved[name] === value }, text))));
      const labelled = (key) => OPTIONS[key].map((v) => [v, v]);

      document.getElementById("fields").replaceChildren(
        el("div", { class: "row2" },
          input("age", f.age, null, { min: 10, max: 100 }),
          input("marks_percent", f.marks, f.marksHint, { min: 0, max: 100 })),
        input("annual_income", f.income, f.incomeHint, { min: 0, step: 1000 }),
        select("state", f.state, STATES.map((s) => [s, s])),
        select("occupation", f.occupation, labelled("occupation")),
        select("category", f.category, labelled("category")),
        select("gender", f.gender, labelled("gender")),
        select("education_level", f.education, labelled("education")),
        select("limit", f.limit, labelled("limit"), f.limitHint, true));
    }

    function applyText() {
      document.getElementById("tagline").textContent = t().tagline;
      document.getElementById("form-title").textContent = t().formTitle;
      document.getElementById("go").textContent = t().go;
      document.getElementById("quick").textContent = t().quick;
      document.getElementById("fine").textContent = t().fine;
      buildForm();
    }

    // ---------- results ----------
    const results = document.getElementById("results");
    let controller = null;    // lets us cancel a running search

    function showEmpty() {
      results.replaceChildren(el("div", { class: "empty" }, el("h2", {}, t().emptyTitle), el("p", {}, t().emptyBody)));
    }
    function errorBox(msg) {
      return el("div", { class: "notice err", role: "alert" }, el("strong", {}, t().errTitle), el("p", {}, msg + " " + t().errHint));
    }

    function evidenceBlock(quote, verified) {
      return el("blockquote", { class: "evidence" },
        quote,
        el("footer", { class: verified ? "ev-yes" : "ev-no" },
          el("span", { class: "seal " + (verified ? "yes" : "no"), "aria-hidden": "true" }, verified ? "✓" : "!"),
          verified ? t().evYes : t().evNo));
    }

    function schemeCard(r) {
      const s = r.scheme;
      const checks = r.checks.map((c) =>
        el("li", {},
          el("span", { class: "mark " + (c.ok === true ? "ok" : c.ok === false ? "no" : "unk"), "aria-hidden": "true" }, c.ok === true ? "✓" : c.ok === false ? "✗" : "?"),
          el("div", {}, c.message, c.evidence && evidenceBlock(c.evidence, c.evidence_verified))));

      const docsEv = s.evidence && s.evidence.documents;
      const progress = el("p", { class: "progress" });
      const total = r.checklist.length;
      const updateProgress = (list) => {
        progress.textContent = t().docsDone(list.querySelectorAll("input:checked").length, total);
      };
      const docList = el("ul", { class: "docs" }, r.checklist.map((d) =>
        el("li", {}, el("label", {}, el("input", { type: "checkbox", onchange: () => updateProgress(docList) }), el("span", {}, d.item)))));
      updateProgress(docList);

      return el("details", { class: "scheme " + r.status, open: r.status !== "not_eligible" },
        el("summary", {},
          el("div", {},
            el("div", { class: "s-name" }, s.name),
            (s.ministry || s.deadline) && el("div", { class: "s-meta" }, [s.ministry, s.deadline && `${t().deadline}: ${s.deadline}`].filter(Boolean).join(" | "))),
          el("span", { class: "badge" }, t().status[r.status])),
        el("div", { class: "body" },
          el("p", { class: "explain" }, r.explanation),
          s.benefits && el("p", {}, el("strong", {}, t().benefits + ": "), s.benefits),
          checks.length > 0 && el("h3", {}, t().why),
          el("ul", { class: "checks" }, checks),
          r.to_verify.length > 0 && [el("h3", {}, t().verify), el("ul", { class: "plain" }, r.to_verify.map((x) => el("li", {}, x)))],
          total > 0 && [el("h3", {}, t().docs), docsEv && evidenceBlock(docsEv, s.evidence_verified && s.evidence_verified.documents), docList, progress],
          s.source_url && el("a", { class: "source", href: s.source_url, target: "_blank", rel: "noopener noreferrer" }, t().open)));
    }

    function setBusy(busy) {
      const go = document.getElementById("go"), quick = document.getElementById("quick");
      go.disabled = quick.disabled = busy;
      if (busy) go.replaceChildren(el("span", { class: "spinner", "aria-hidden": "true" }), t().working);
      else go.textContent = t().go;
    }

    // ---------- live search (streams results as they arrive) ----------
    let live = null;
    function startLive() {
      const statusEl = el("div", { class: "status", role: "status" });
      const cards = el("div");
      results.replaceChildren(el("h2", {}, t().results), statusEl, cards);
      live = { statusEl, cards, counts: { eligible: 0, maybe: 0, not_eligible: 0 }, total: 0, saved: 0, finished: 0, skipped: 0, seq: 0, running: true, found: false };
      renderStatus();
    }

    function renderStatus() {
      const L = live, c = L.counts, parts = [];
      if (L.running) parts.push(el("span", { class: "spinner", "aria-hidden": "true" }));
      let text;
      if (!L.found) text = t().searching;
      else if (L.running) text = `${t().foundN(L.total, L.saved)} ${t().progress(L.finished, L.total)}. `;
      else text = t().finished + " ";
      const shown = c.eligible + c.maybe + c.not_eligible;
      const tail = shown ? t().tally(c.eligible, c.maybe, c.not_eligible) + ". " : "";
      const skipped = !L.running && L.skipped ? t().skipped(L.skipped) : "";
      L.statusEl.replaceChildren(...parts, el("span", {}, text, el("strong", {}, tail), skipped));
    }

    // Insert a card in sorted position without touching the cards already on screen.
    function addCard(r) {
      const card = schemeCard(r);
      const order = ORDER[r.status] * 100000 + live.seq++;
      card.dataset.order = order;
      const after = [...live.cards.children].find((c) => Number(c.dataset.order) > order);
      live.cards.insertBefore(card, after || null);
      live.counts[r.status]++;
    }

    function handleEvent(ev) {
      if (ev.type === "found") { live.total = ev.total; live.saved = ev.cached; live.found = true; }
      else if (ev.type === "scheme") { addCard(ev.result); live.finished++; }
      else if (ev.type === "skip") { live.finished++; live.skipped++; }
      else if (ev.type === "done") {
        live.running = false;
        if (live.total === 0) live.cards.replaceChildren(el("div", { class: "notice" }, t().noneFound));
      } else if (ev.type === "error") {
        live.running = false;
        results.prepend(errorBox(ev.message));
      }
      renderStatus();
    }

    async function findLive() {
      if (controller) controller.abort();
      const mine = (controller = new AbortController());
      setBusy(true);
      startLive();
      try {
        const { profile, limit } = readProfile();
        const res = await fetch("/api/discover", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ profile, limit }), signal: mine.signal,
        });
        if (!res.ok) throw new Error((await res.json()).error || "Request failed");
        const reader = res.body.getReader(), decoder = new TextDecoder();
        let buffer = "";
        for (; ;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let end;
          while ((end = buffer.indexOf("\n\n")) >= 0) {
            const chunk = buffer.slice(0, end);
            buffer = buffer.slice(end + 2);
            if (chunk.startsWith("data: ")) handleEvent(JSON.parse(chunk.slice(6)));
          }
        }
        if (live.running) { live.running = false; renderStatus(); }
      } catch (e) {
        if (e.name === "AbortError") return;
        if (live) { live.running = false; renderStatus(); }
        results.prepend(errorBox(e.message));
      } finally {
        if (controller === mine) setBusy(false); // an older, cancelled search must not re-enable the buttons
      }
    }

    // ---------- quick check of saved schemes ----------
    async function findQuick() {
      if (controller) controller.abort();
      controller = null;
      setBusy(true);
      try {
        const { profile } = readProfile();
        const [matchRes, healthRes] = await Promise.all([
          fetch("/api/match", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ profile }) }),
          fetch("/api/health"),
        ]);
        const data = await matchRes.json();
        if (!matchRes.ok) throw new Error(data.error || "Request failed");
        const demo = (await healthRes.json()).using_demo_data;
        const list = data.results;
        if (!list.length) { results.replaceChildren(el("div", { class: "notice" }, t().noSchemes)); return; }
        const count = (s) => list.filter((r) => r.status === s).length;
        results.replaceChildren(
          demo && el("div", { class: "notice demo" }, t().demo),
          el("h2", {}, t().results),
          el("p", { class: "tally" }, t().tally(count("eligible"), count("maybe"), count("not_eligible"))),
          list.map(schemeCard));
      } catch (e) {
        results.replaceChildren(errorBox(e.message));
      } finally {
        setBusy(false);
      }
    }

    // ---------- wiring ----------
    document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); findLive(); });
    document.getElementById("quick").addEventListener("click", findQuick);
    applyText();
    showEmpty();
  </script>
</body>

</html>
